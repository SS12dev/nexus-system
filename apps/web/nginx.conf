# Only send HSTS when the browser came over https (the Cloudflare tunnel); an empty value
# leaves the header out.
map $http_x_forwarded_proto $hsts {
  https   "max-age=31536000";
  default "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = /healthz { return 200 "ok"; }

  # Hashed build assets can be cached forever; the service worker and HTML must not be.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Linked from the Google consent screen and the sign-in page, so they must load without
  # signing in.
  location = /privacy {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /privacy.html =404;
  }
  location = /terms {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /terms.html =404;
  }
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
