# Jarvis on one machine. `cp .env.example .env` (or run scripts/init-env.sh), then
# `docker compose up -d --build` and open http://localhost:8080.
name: jarvis

x-jarvis-env: &jarvis-env
  ENV: ${ENV:-development}
  DATABASE_URL: postgresql+asyncpg://jarvis:${POSTGRES_PASSWORD}@postgres:5432/jarvis
  REDIS_URL: redis://redis:6379/0
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
  LITELLM_VIRTUAL_KEYS: ${LITELLM_VIRTUAL_KEYS:-true}
  LITELLM_API_KEY: ${LITELLM_API_KEY:-}
  JARVIS_CHAT_MODEL: ${JARVIS_CHAT_MODEL:-jarvis-mini}
  DEFAULT_BUDGET_USD: ${DEFAULT_BUDGET_USD:-5}
  OWNER_BUDGET_USD: ${OWNER_BUDGET_USD:-50}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  SIGNUP_POLICY: ${SIGNUP_POLICY:-invite_only}
  OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
  DEV_LOGIN_TOKEN: ${DEV_LOGIN_TOKEN:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-jarvis}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: jarvis
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-jarvis-embed}
  MEMORY_MODEL: ${MEMORY_MODEL:-jarvis-nano}

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_CONNECTION_STRING: redis://redis:6379/1
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-jarvis}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-jarvis}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  # --- Edge ------------------------------------------------------------------
  traefik:
    # v3.6+ negotiates the Docker API version; older releases fail against Docker Engine 29.
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=jarvis_default
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
    ports:
      - "${JARVIS_HTTP_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [traefik]
    restart: unless-stopped

  # --- Jarvis ----------------------------------------------------------------
  web:
    build: apps/web
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=80
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: services/api/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment: *jarvis-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment: *jarvis-env
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/auth`) || Path(`/ws`)
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/healthz
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  orchestrator:
    build: { context: ., dockerfile: services/orchestrator/Dockerfile }
    environment: *jarvis-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  doc-worker:
    build:
      context: .
      dockerfile: services/doc-worker/Dockerfile
      args:
        DOCLING: ${DOCLING:-true}
    environment: *jarvis-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  # --- Data ------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jarvis
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    # Langfuse's queues need noeviction.
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    # Folders under /data are buckets: jarvis for uploads, langfuse for trace events.
    command: -c 'mkdir -p /data/jarvis /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jarvis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --- Model gateway and tracing ----------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
      # Embeddings run in Ollama on the Mac itself, which can use the GPU.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Docker Desktop provides host.docker.internal; this adds it on Linux too.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    environment: *langfuse-env
    depends_on: &langfuse-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:${LANGFUSE_PORT:-3000}}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      # Creates the org, project, API keys and an admin login on first start.
      LANGFUSE_INIT_ORG_ID: jarvis
      LANGFUSE_INIT_ORG_NAME: Jarvis
      LANGFUSE_INIT_PROJECT_ID: jarvis
      LANGFUSE_INIT_PROJECT_NAME: Jarvis
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@jarvis.local}
      LANGFUSE_INIT_USER_NAME: Jarvis admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?set LANGFUSE_ADMIN_PASSWORD in .env}
      AUTH_DISABLE_SIGNUP: "true"
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    depends_on: *langfuse-deps
    restart: unless-stopped

volumes:
  postgres:
  redis:
  minio:
  clickhouse:
  clickhouse-logs:
