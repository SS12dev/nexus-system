# Allowlist proxy for the workbench. Hosts are matched against allowlist (one regular
# expression per line); anything else gets a 403. HTTPS only to port 443.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Notice
DisableViaHeader Yes

Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
ConnectPort 443
