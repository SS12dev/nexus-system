# LiteLLM proxy for Nexus. Agents only ever name the nexus-* aliases, so swapping a model is a
# change here, not in code. Candidate research: docs/model-selection.md.
# Screenshots in chat are sent to the model as images, so every chat-facing alias must be a
# model that reads images; every model below does.
#
# Lineup (thread "Plan professional-grade Nexus upgrade", 2026-11-17): Claude for chat,
# building, planning and review; Gemini Flash for quick work with long inputs; OpenAI as the
# automatic fallback for each alias (see fallbacks below), so Nexus keeps answering when a
# provider is down, out of credit or its key is missing. Prices are USD per token from each
# provider's price list on 2026-11-17; they are set here so budgets count correctly even if
# LiteLLM's own price map doesn't know a model yet. The app reads the first deployment of each
# alias from /model/info to show its real name.
model_list:
  - model_name: nexus-nano     # routing, intent, memory extraction, titles, summaries
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points: [{location: message, role: system}]
    model_info: {input_cost_per_token: 0.0000001, output_cost_per_token: 0.0000005}
  - model_name: nexus-mini     # quick tool use, long documents, self-review topics
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
    # Doubles to $1.50 / $7.50 per million on 2027-01-01.
    model_info: {input_cost_per_token: 0.00000075, output_cost_per_token: 0.00000375}
  - model_name: nexus-pro      # the default: chat, research, writing, building code
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points: [{location: message, role: system}]
    model_info: {input_cost_per_token: 0.000002, output_cost_per_token: 0.00001}
  - model_name: nexus-max      # planning, architecture, design, code review
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points: [{location: message, role: system}]
    model_info: {input_cost_per_token: 0.000004, output_cost_per_token: 0.00002}

  # OpenAI fallbacks, one per alias. Agents never name these; LiteLLM switches to them itself.
  - model_name: nexus-nano-fallback
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
  - model_name: nexus-mini-fallback
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: nexus-pro-fallback
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
  - model_name: nexus-max-fallback
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
  # Embeddings for memory and document search: bge-m3 in Ollama on the host, free and local
  # (`ollama pull bge-m3`). Vectors must be 1024 wide. To use OpenAI instead, swap in:
  #   model: openai/text-embedding-3-small
  #   api_key: os.environ/OPENAI_API_KEY
  #   dimensions: 1024
  # then restart the workers; a background job re-embeds everything with the new model.
  - model_name: nexus-embed
    litellm_params:
      model: ollama/bge-m3
      api_base: os.environ/OLLAMA_BASE_URL
      # Ollama unloads an idle model after 5 minutes, and loading bge-m3 again adds about
      # 1.2 s to the next message. It is about 650 MB, so keep it loaded.
      keep_alive: -1

litellm_settings:
  # Every generation, with cost, goes to Langfuse (LANGFUSE_* env vars).
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Exact-match cache only: semantic caching misfires on agentic traffic.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    namespace: litellm.cache
    ttl: 3600
  drop_params: true
  # Each alias falls back to its OpenAI model when its own provider fails after retries.
  fallbacks:
    - {"nexus-nano": ["nexus-nano-fallback"]}
    - {"nexus-mini": ["nexus-mini-fallback"]}
    - {"nexus-pro": ["nexus-pro-fallback"]}
    - {"nexus-max": ["nexus-max-fallback"]}

router_settings:
  num_retries: 2
  timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Virtual keys, budgets and spend logs live here.
  database_url: os.environ/DATABASE_URL
