# LiteLLM proxy for Nexus. Agents only ever name the nexus-* aliases, so swapping a model is a
# change here, not in code. Candidate research: docs/model-selection.md.
# Screenshots in chat are sent to the model as images, so every chat-facing alias must be a
# model that reads images; all four GPT-5.4/5.5 tiers do, including the nano fallback.
model_list:
  - model_name: nexus-nano     # routing, intent, memory extraction, titles, summaries
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
  - model_name: nexus-mini     # most sub-agents, tool calling, RAG answers, plain chat
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: nexus-pro      # planning, designing agent systems, hard reasoning
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
  - model_name: nexus-max      # escalation only
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
  # Embeddings for memory and document search: bge-m3 in Ollama on the host, free and local
  # (`ollama pull bge-m3`). Vectors must be 1024 wide. To use OpenAI instead, swap in:
  #   model: openai/text-embedding-3-small
  #   api_key: os.environ/OPENAI_API_KEY
  #   dimensions: 1024
  # then restart the workers; a background job re-embeds everything with the new model.
  - model_name: nexus-embed
    litellm_params:
      model: ollama/bge-m3
      api_base: os.environ/OLLAMA_BASE_URL
      # Ollama unloads an idle model after 5 minutes, and loading bge-m3 again adds about
      # 1.2 s to the next message. It is about 650 MB, so keep it loaded.
      keep_alive: -1

litellm_settings:
  # Every generation, with cost, goes to Langfuse (LANGFUSE_* env vars).
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Exact-match cache only: semantic caching misfires on agentic traffic.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    namespace: litellm.cache
    ttl: 3600
  drop_params: true
  # nexus-mini falls back to nexus-nano if it is down.
  fallbacks: [{"nexus-mini": ["nexus-nano"]}]

router_settings:
  num_retries: 2
  timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Virtual keys, budgets and spend logs live here.
  database_url: os.environ/DATABASE_URL
