[project]
name = "nexus-common"
version = "0.1.0"
description = "Shared settings, database models and event schemas for Nexus services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "pgvector>=0.4",
    "aiobotocore>=2.15",
    "pyyaml>=6.0",
    "cryptography>=43",
    "python-dateutil>=2.9",
    "pywebpush>=2.0",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_common"]
