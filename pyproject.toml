[project]
name = "nexus-system"
version = "0.1.0"
description = "Nexus: a supervisor agent that builds and runs sub-agent systems"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/common",
    "services/api",
    "services/orchestrator",
    "services/doc-worker",
    "services/sandbox",
    "services/workbench",
    "services/deployer",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "httpx>=0.28",
    "fakeredis>=2.26",
    "nexus-common",
    "nexus-api",
    "nexus-orchestrator",
    "nexus-doc-worker",
    "nexus-sandbox",
    "nexus-workbench",
    "nexus-deployer",
]

[tool.uv.sources]
nexus-common = { workspace = true }
nexus-api = { workspace = true }
nexus-orchestrator = { workspace = true }
nexus-doc-worker = { workspace = true }
nexus-sandbox = { workspace = true }
nexus-workbench = { workspace = true }
nexus-deployer = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = [
    "services/api/tests",
    "services/orchestrator/tests",
    "services/doc-worker/tests",
    "services/sandbox/tests",
    "services/workbench/tests",
    "services/deployer/tests",
]
addopts = "--import-mode=importlib"

[tool.ruff.lint.isort]
known-first-party = [
    "nexus_common",
    "nexus_api",
    "nexus_orchestrator",
    "nexus_doc_worker",
    "nexus_sandbox",
    "nexus_workbench",
    "nexus_deployer",
]
