[project]
name = "jarvis-api"
version = "0.1.0"
description = "Jarvis API: auth, chats, admin and the WebSocket event stream"
requires-python = ">=3.12"
dependencies = [
    "jarvis-common",
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "uvicorn[standard]>=0.32",
    "authlib>=1.3",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "alembic>=1.14",
    "arq>=0.26",
]

[tool.uv.sources]
jarvis-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_api"]
