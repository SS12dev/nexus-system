[project]
name = "nexus-deployer"
version = "0.1.0"
description = "Nexus deployer: builds software projects into containers on the apps network, through a Docker API gate"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_deployer"]
