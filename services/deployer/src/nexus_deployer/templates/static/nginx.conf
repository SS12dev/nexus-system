server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    # Single-page apps: unknown paths get the app, which routes them itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
    # /api belongs to the back end (Traefik routes it there). Never answer it with the app, or
    # a health check could pass before the back end is routed.
    location /api/ {
        return 404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
