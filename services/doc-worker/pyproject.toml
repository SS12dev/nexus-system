[project]
name = "jarvis-doc-worker"
version = "0.1.0"
description = "Jarvis doc-worker: parses uploads into searchable, embedded chunks"
requires-python = ">=3.12"
dependencies = [
    "jarvis-common",
    "arq>=0.26",
    "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.3",
]

# Docling (layout-aware PDF tables, OCR for scans and images) needs PyTorch, so it is installed
# only in the Docker image, from the CPU wheel index; see the Dockerfile. Without it, PDFs and
# images fall back to MarkItDown.

[tool.uv.sources]
jarvis-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_doc_worker"]
