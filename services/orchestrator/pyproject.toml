[project]
name = "jarvis-orchestrator"
version = "0.1.0"
description = "Jarvis orchestrator: LangGraph workers that run Jarvis turns from the Redis queue"
requires-python = ">=3.12"
dependencies = [
    "jarvis-common",
    "arq>=0.26",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
]

[tool.uv.sources]
jarvis-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_orchestrator"]
