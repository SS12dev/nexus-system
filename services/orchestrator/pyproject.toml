[project]
name = "nexus-orchestrator"
version = "0.1.0"
description = "Nexus orchestrator: LangGraph workers that run Nexus turns from the Redis queue"
requires-python = ">=3.12"
dependencies = [
    "nexus-common",
    "arq>=0.26",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pypdf>=5.1",
    # zoneinfo data for calendar time zones (the slim image has no system tzdata).
    "tzdata>=2024.1",
    "igraph>=0.11",
]

[tool.uv.sources]
nexus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_orchestrator"]
