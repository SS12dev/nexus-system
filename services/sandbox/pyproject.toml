[project]
name = "jarvis-sandbox"
version = "0.1.0"
description = "Jarvis sandbox: runs agent code with no network, resource caps and document libraries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # What agent code and skill scripts can use.
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "weasyprint>=63",
    "markdown>=3.7",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "pillow>=11.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    # Time zones for scheduling scripts; the slim image has no system zoneinfo.
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_sandbox"]
