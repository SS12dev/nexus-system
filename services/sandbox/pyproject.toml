[project]
name = "nexus-sandbox"
version = "0.1.0"
description = "Nexus sandbox: runs agent code with no network, resource caps and document libraries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # What agent code and skill scripts can use.
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "weasyprint>=63",
    "markdown>=3.7",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "pillow>=11.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    # Time zones for scheduling scripts; the slim image has no system zoneinfo.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# 3D modelling for the 3d-modeling skill: build123d (CAD on the OpenCascade kernel) for exact
# parts and STEP files, trimesh and manifold3d for mesh checks and 3MF/GLB. About 600 MB, so the
# image installs it only with CAD=true (the default).
cad = [
    "build123d>=0.10",
    "trimesh>=4.5",
    "manifold3d>=3.0",
    # trimesh needs it to write 3MF.
    "networkx>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_sandbox"]
