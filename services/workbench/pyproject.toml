[project]
name = "nexus-workbench"
version = "0.1.0"
description = "Nexus workbench: persistent project folders where dev-team agents edit, run and commit code"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_workbench"]
